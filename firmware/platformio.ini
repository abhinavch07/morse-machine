; PlatformIO project settings for the Morse machine ESP32.
; Lines starting with ; are comments.

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; The CP2102 USB chip on the board shows up on the Mac under this name.
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001

; Must match Serial.begin() in main.cpp, or the monitor shows garbage.
monitor_speed = 115200
