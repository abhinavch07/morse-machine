; PlatformIO project settings for the Morse machine ESP32.
; Lines starting with ; are comments.

[platformio]
; The Build and Upload buttons in VS Code use the ESP32, not the Mac tests.
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; The CP2102 USB chip on the board shows up on the Mac under this name.
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001

; Must match Serial.begin() in main.cpp, or the monitor shows garbage.
monitor_speed = 115200

; U8g2 draws text on the SH1106 OLED. Only the ESP32 needs it, not the tests.
lib_deps = olikraus/U8g2@^2.36.18

; The unit tests run on the Mac only (see env:native below).
test_ignore = *

[env:native]
; Builds and runs the unit tests on the Mac itself. No board needed.
; Run them with: pio test -e native
platform = native
